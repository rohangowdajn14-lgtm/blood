
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register as Donor | BloodConnect</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header>
    <div class="logo">🩸 BloodConnect</div>
    <nav>
        <a href="/">Home</a>
        <a href="/#about">About Us</a>
        <a href="/register">Register</a>
        <a href="/search">Find Blood</a>
    </nav>
</header>

<section class="register-section">
    <div class="register-heading">
        <h1>Become a Blood Donor ❤️</h1>
        <p>Your one donation can help save someone's life.</p>
    </div>

    <form class="register-form" method="POST" action="/register">

        <label>Full Name</label>
        <input type="text" name="full_name" placeholder="Enter your full name" required>

        <label>Age</label>
        <input type="number" name="age" placeholder="Enter your age" min="18" required>

        <label>Gender</label>
        <select name="gender" required>
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        <label>Blood Group</label>
        <select name="blood_group" required>
            <option value="">Select Blood Group</option>
            <option>A+</option>
            <option>A-</option>
            <option>B+</option>
            <option>B-</option>
            <option>AB+</option>
            <option>AB-</option>
            <option>O+</option>
            <option>O-</option>
        </select>

        <label>Phone Number</label>
        <input type="tel" name="phone" placeholder="Enter phone number" required>

        <label>Email Address</label>
        <input type="email" name="email" placeholder="Enter email address" required>
        <label>Create Password</label>
        <input type="password" name="password"
            placeholder="Create a password (minimum 8 characters)"
            minlength="8" required>
        <label>City</label>
        <input type="text" name="city" placeholder="Enter your city" required>

        <button type="submit" class="btn register-button">
            Register as Donor
        </button>

    </form>
</section>

<footer>
    <h2>🩸 BloodConnect</h2>
    <p>Connecting Donors. Saving Lives.</p>
    <p>© 2026 BloodConnect. All Rights Reserved.</p>
</footer>

</body>
</html>
